<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng điều khiển | Travel Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css?v=7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231769e0%22 stroke-width=%222%22><path d=%22m4 13.5 16-9-6.8 15-2.1-5.2L4 13.5Z%22/><path d=%22m11.1 14.3 3.6-4.4%22/></svg>">
  <style>
    .dashboard-container {
      max-width: 680px;
      margin: 80px auto;
      padding: 40px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(16, 33, 63, 0.08);
      text-align: center;
    }
    .user-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1769e0, #0e54c5);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
    }
    .badge-session {
      display: inline-block;
      padding: 6px 14px;
      background: #eefbf4;
      color: #1b633b;
      font-size: 12px;
      font-weight: 700;
      border-radius: 20px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div id="dashboard-page" class="dashboard-container">
    <div id="dash-avatar" class="user-avatar">U</div>
    <span class="badge-session">● Phiên đăng nhập hoạt động</span>
    <h1 style="font-size: 28px; margin-bottom: 8px;">Chào mừng trở lại, <span id="dash-name">Khách du lịch</span>!</h1>
    <p style="color: var(--muted); margin-bottom: 30px;" id="dash-email">email@example.com</p>

    <div style="display: flex; gap: 12px; justify-content: center; max-width: 380px; margin: 0 auto;">
      <a href="index.html" class="primary-button" style="text-decoration: none;">Khám phá lộ trình</a>
      <button type="button" id="btn-logout" class="secondary-button" style="margin-top: 0;">Đăng xuất</button>
    </div>
  </div>

  <script type="module" src="js/auth.js?v=7"></script>
</body>
</html>
